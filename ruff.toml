# Managed by baseline-py. Rules are listed explicitly: ALL expands silently on
# every ruff upgrade, turning a dependency bump into a lint failure.
line-length = 100
target-version = "py311"

[lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # bugbear
  "A",    # builtin shadowing
  "C4",   # comprehensions
  "DTZ",  # naive datetimes
  "T20",  # print in library code
  "SIM",  # simplifiable code
  "RET",  # return control flow
  "ARG",  # unused arguments
  "PTH",  # pathlib over os.path
  "ERA",  # commented-out code
  "PL",   # pylint: complexity, branches, statements
  "RUF",  # ruff-specific
  "D",    # docstrings; replaces interrogate
  # bandit, curated: the full S set is intentionally noisy in tests and in
  # subprocess-heavy code.
  "S102", "S103", "S104", "S105", "S106", "S107", "S108",
  "S301", "S302", "S303", "S304", "S305", "S306",
  "S324", "S501", "S506", "S508", "S509",
  "S608", "S609", "S612",
]
ignore = [
  # Project decisions, permanent. qlctool is a command someone runs; print is
  # how it reports, and its generators lazily import the heavy lxml paths.
  "T201",
  "PLC0415",

  # Adoption ratchet, 2026-09-01. Each line is debt with the count the
  # baseline found on arrival, not a decision. Fix a family, delete its line;
  # never add one. 424 findings total.
  "D1",       # 142 undocumented public modules, classes, methods, functions
  "D205", "D210",  # 10 docstring layout
  "PLR0913", "PLR0917",  # 104 generators taking one keyword per show parameter
  "PLR0911", "PLR0912", "PLR0915",  # 12 oversized functions
  "PLR2004",  # 26 magic values, mostly DMX channel numbers and QLC+ constants
  "B905",     # 24 zip() calls that predate strict=; each needs a decision on
              # whether a length mismatch is a bug or expected truncation, and
              # in this repository that is exactly the class of failure the
              # check rules exist to catch - worth doing deliberately
  "ARG001",   # 4  unused arguments in callback signatures
  "RUF005", "RUF059",  # 5
  "E402", "PLW2901", "SIM105",  # 3

  # Conflicts with the formatter; keeping these on fights ruff format forever.
  "E501", "W191", "E111", "E114", "E117", "D206", "D300", "COM812", "ISC001",
  "D203",  # incompatible with D211
  "D107",  # an __init__ that stores its arguments has nothing to add to the class docstring
  "D213",  # incompatible with D212
]

[lint.per-file-ignores]
# **/ so the pattern also reaches nested test roots such as host/tests.
"**/tests/**" = ["D", "S101", "S105", "S106", "S108", "ARG", "PLR"]
"**/conftest.py" = ["D"]

[lint.pydocstyle]
convention = "google"

[format]
docstring-code-format = true
