# A small club: six RGB pars, two beam moving heads and two washes. A
# different patch from the Vibra show's: three of Vibra's models in other
# numbers, addresses and groups, with no haze machine and no controllers.
# Every other choice falls back to the toolkit's defaults.
# Regenerate from the toolkit's root:
#   qlctool newshow --description examples/small-club/show.toml --validate

[show]
name = "Small Club"
language = "en"

[rig]
workspace = "club-patch.qxw"
output = "club.qxw"
fixtures = ["fixtures"]
