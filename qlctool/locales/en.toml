promise_heads = "a fixture with pan and tilt"
promise_dimmer = "a fixture with a fader dimmer"
collision_same_channels = "starts «{first}» and «{second}» together, and both write the same colour, wheel or position channels: they add up instead of one winning"
colour_animation_wheel_stuck = "animates the colour of {animated} RGB fixtures and leaves {stuck} with a colour wheel in one position: the effect runs round the room and those stay one fixed colour"
colour_clocks_together = "starts {clocks} together, two cycles that each rotate colour at their own pace: the fixtures of one drift apart from the rest (button: {button})"
list_and = " and "
console_solo_clash = "shares the solo frame «{frame}» with {clash}, which is what it starts: the frame will stop it as soon as it is pressed"
console_same_key = "share the key «{key}»: pressing it fires them all"
console_off_screen = "runs off the screen ({right}x{bottom} on {width}x{height}): nobody can press it"
console_out_of_frame = "runs out of its own frame «{frame}» ({right}x{bottom} on the frame's {width}x{height}): it is cut off or covers what is next to it"
console_two_blackouts = "has two Blackout buttons («{seen}» and «{caption}»): one of them will always look off"
dangling_reference_missing = "names function {function}, which does not exist in this workspace: that step or button starts nothing"
dangling_reference_empty = "(empty)"
desk_burst_incomplete = "needs a source, a duration and exactly one burst Toggle"
desk_burst_needs_toggle = "needs an independent Toggle on CONTROL"
desk_burst_not_a_chaser = "the button does not point at a Chaser"
desk_burst_chaser_setting = "{tag} must be {expected}"
desk_burst_speed_modes = "SpeedModes must set Duration=PerStep and Common fades"
desk_burst_zero_fades = "the common fades must be zero"
desk_burst_time_clock = "the clock must count milliseconds"
desk_burst_one_step = "needs exactly one step"
desk_burst_step_timing = "the step must last {duration} ms with no fades"
desk_burst_step_no_scene = "the step references no scene"
desk_burst_scenes = "the step and its source must be scenes"
desk_burst_private_copy = "the step must be a private copy with the same FixtureVal"
desk_burst_shared_scene = "another function references the private scene"
desk_burst_auto_start = "another function can start the burst automatically"
desk_burst_widget_scene = "a widget references the private scene directly"
desk_burst_one_button = "the burst must have one button and no other control"
empty_frame_nothing_to_press = "this frame holds no control, only text or nothing: there is nothing on it to press"
empty_frame_untitled = "frame {id}"
empty_frame_untitled_solo = "solo frame {id}"
family_owner_no_toggle = "has no Toggle in the frame: a room state also writes that family, and on a change of state the choice would be left dangling"
family_owner_state_pick = "is a pick a room state also starts: the frame will only stop it when that state starts"
family_owner_starts_hook = "starts the hook «{hook}» of the same solo frame: the frame will stop it as soon as it is pressed"
flash_scene_not_a_scene = "hangs in Flash mode from the button «{button}», but its type is {kind}: QLC+ can only flash scenes (Scene::flash), so the button does half the job"
flash_scene_nothing = "none (no function has that id)"
flash_speed_slow = "is the fastest flash {count} strobe channels get and stops at {slowest:.0%} of their slow-to-fast travel - a full-speed flash lives at {fast:.0%} and above"
flash_speed_crawl = "writes {count} strobe channels below {crawl:.0%} of their slow-to-fast travel (the worst at {slowest:.0%}) - that is no longer a flash, it is a flicker at a snail's pace"
flash_strobe_audio = "strobes and is pressed by an audio bar: a strobe fired by whatever the music does is a strobe nobody chose"
flash_lit_smoke_column_dark = "hangs from a Flash button, lights the whole rig and leaves {count} lit smoke machines without lighting their LED: while it is held the columns keep the colour beneath, unstrobed, and read as dark next to the flash"
flash_strobe_not_strobing = "hangs from a Flash button and writes {count} fixtures with a strobe channel without strobing them - in this show a held flash strobes, and leaving the shutter at «Open»/«No function» is the work light, not the hit"
grid_order_row_jumps = "row {row} of the grid jumps across the stage {count} times ({jumps}{more}): a sweep over the grid does not sweep the room. `qlctool patch --group-sort {group}` reorders it"
grid_order_not_rigged = "not rigged"
group_grid_heads_outside = "declares {width}x{height} but has {outside} head(s) outside that grid: no effect reaches them"
group_grid_dark_cells = "declares {width}x{height} = {cells} cells and only {lit} have a light: every sweep leaves {empty} cell(s) dark for no reason"
held_column_latched_pump = "fires the smoke columns' pump from a button that latches: a column should only come out while the key is held"
instant_dimmer_dark = "at some instant it colours {count} fixtures and no member writes their dimmer: the dimmer is Intensity, QLC+ zeroes it every cycle, and the fixture is coloured in the data and dark in the room"
intensity_dark_one = "sets a colour but does not open the intensity, so that fixture stays dark (button: {button})"
intensity_dark_many = "sets a colour but does not open the intensity, so those fixtures stay dark (button: {button})"
internal_program_colour = "colours a fixture without taking it out of its internal programme: while that channel stays on automatic the fixture ignores the red, green and blue you send"
latched_strobe_loops = "is a looping strobe hanging from the button «{caption}»: one press and the rig flickers until somebody stops it; a burst is a SingleShot chaser that ends by itself"
layer_adds_htp_colour = "is a Toggle («{caption}») that puts colour on {count} fixtures the state already colours: RGB mixes HTP, so red over cyan is white, never red - a colour that replaces is a Flash with ForceLTP"
layer_trace_ltp_left = "is a Toggle («{caption}») that writes {count} LTP channels no room state ever writes: when it is switched off the value stays until somebody changes it by hand"
masked_dimmer_efx_hidden = "«{full}» pins a dimmer at {level} while «{efx}» moves it as an effect at the same time: intensity mixes HTP, nothing beats {level} and the effect is never seen"
mode_owner_unwritten = "no function in the show writes the channel the fixture runs its own programmes with: it keeps whatever the previous night left, and while it is up the fixture ignores position, colour and intensity"
movement_families_mixed = "moves {washes} wash(es) and {beams} beam(s) with the same geometry; a 2-degree beam and a wide wash share neither size nor speed - one EFX per family"
movement_figure_still_heads = "moves {moved} fixtures of the group and leaves {still} still although they have pan and tilt: only one optical family draws the figure"
movement_window_outside = "draws {outside}, and the audience is at pan {pan_min}-{pan_max} tilt {tilt_min}-{tilt_max}: part of the figure aims out of the room"
pad_input_unknown_channel = "listens on channel {channel}, which is not in the pad's profile: no control on the device sends that number, so the widget cannot be pressed from the hardware"
pad_input_shared_channel = "shares channel {channel} with {others}: one control fires them all at once"
pad_input_no_input = "{count} widget(s) have a MIDI binding and no universe declares <Input>: QLC+ opens the show with nobody listening, and the pad does nothing until it is set up by hand"
parked_movers_still = "is a block of the automatic cycle that moves some heads and leaves these still for the whole step: a moving head that does not move for minutes looks broken, not at rest"
pick_darkens_dark = "the pick «{pick}» stops its hooks and leaves {count} coloured fixtures with no dimmer or with the shutter closed"
pick_overridden_one_step = "is a Toggle («{caption}») over a wheel or a position that a chaser of {overridden} writes again on its next step: the new fader comes in behind and wins - the choice lasts one step; a Flash with Override lasts as long as the hand"
shadowed_intensity_hidden = "«{member}» leaves a dimmer at {low} while «{top}» holds the same channel at {top_value}: intensity mixes HTP, the higher wins and the dip is never seen"
shutter_endpoint_half_open = "opens the shutter at {value} instead of {endpoint}: inside the 'open' range, but short of its end - the 7R goes dark in the middle of that range"
smoke_in_scene = "switches the smoke machine on inside a scene that touches other fixtures: the smoke stays on while that scene runs"
smoke_light_dark_column = "the lit smoke machine fires its column but no function lights its LED (dimmer + colour together): with DMX connected its internal programme is overridden and the column comes out dark"
smoke_restore_pump_left = "the button «{caption}» opens the smoke pump on a channel QLC+ does not reset by itself - it is not in the Intensity group - and the function does not close it: on release the machine keeps pumping until the tank is empty"
solo_handoff_excludes_monitored = "ignores the buttons that only monitor: another state or button starts {names}, and a choice in the frame will not stop it (ExcludeMonitored must be False)"
split_complementary_one_wash = "alternates two opposite colours ({degrees:.0f} degrees) inside one group: where they overlap they wash out towards white. Complementaries go between roles (heads against the rest); within one wash, neighbouring colours (button: {button})"
state_handover_inherits = "lights {count} fixtures without writing {roles}: those channels are LTP and stay as the previous state left them - the work light comes out with the gobo and prism of the last level"
state_palette_too_many = "the step «{step}» puts {count} colours in the room at once and the state lets it rotate by itself: two at most (a background and the heads); multicolour is a button of its own (button: {button})"
state_proxy_starts_state = "starts «{state}», which is a button of the room-states frame: the button notices even when a chaser starts it (qmlui VCButton::slotFunctionRunning) and the solo frame stops whatever state was playing - the show dies mid-burst"
stepped_dimmer_half = "writes an in-between value to a dimmer that is not a fader but a mechanical blade: half-way it covers half the lens and the beam comes out as a half moon - either fully open or fully closed"
strobe_black_intensity_only = "hangs from «{caption}» and its black step ({step}) writes only Intensity channels, which mix HTP: with a lit state underneath the 0 loses and the strobe never reaches black - a strobe over the room is a scene held on the shutters"
strobe_coverage_left_out = "is a strobe scene that leaves out {count} fixtures with a strobe channel: half the room flickers and the other half looks on"
strobe_in_cycle_steps = "carries {count} strobe effect(s) among its steps, so the rig flickers without anybody asking; a strobe goes on its own button"
strobe_rate_too_fast = "flashes at {rate:.1f} Hz; above {limit:.0f} Hz it enters the photosensitive epilepsy risk band - the British guidance for shows draws the line at 4 per second"
strobe_restore_left_strobing = "the flash «{caption}» strobes a channel that {states} never writes: on release the LTP channel keeps strobing until somebody stops it by hand"
tap_dial_no_functions = "has a tap key and lists no function: in QLC+ 5.2.2 the tap only writes to the dial's functions («Unknown speed dial tag: ControlBPM» on load), so this way it re-tempos nothing"
tap_dial_same_multiplier = "re-tempos {count} functions with the same multiplier: one tap gives them all the same duration (VCSpeedDial::applyFunctionsTime writes time x multiplier) - each layer has to say how many taps it lasts"
tempo_units_collection_tempo = "is a collection carrying <Tempo>: a collection has no tempo of its own, it just starts its members - QLC+ says so on load («Unknown collection tag: Tempo») and ignores it, so that layer stays on the clock without warning"
tempo_units_beats_fade = "runs in Beats with a fade of {fade} and starts {count} functions timed in milliseconds: the chaser hands them that number as it is and an EFX subtracts it from its duration (EFX::loopDuration), so they draw their figure much faster and never close it"
unaimed_movement_mid_tilt = "draws the figure centred on tilt {tilt}, which is the middle of the travel, not a place: it is where a figure nobody aimed ends up - the floor for the 7R, the back wall for the washes"
undeclared_heads_one_head = "its definition gives it {sets} RGB sets and only {declared} <Head> with red, green and blue inside: QLC+ makes a single head and keeps the last red, green and blue, so a matrix over «{group}» paints only one of the sets and the others keep whatever somebody wrote last"
unfinished_effect_cut = "cuts {count} of its effects before they finish: «{effect}» needs {needed} ms for one full pass and only gets {given} ms"
untempoed_rhythm_no_dial = "«{member}» moves the intensity of {count} fixtures and is under no tempo dial: its pace does not change when the room's does"
wheel_colour_missed = "colours a group but writes nothing to the fixtures of that group whose colour is a wheel: they keep the previous colour (button: {button})"
wheel_fade_crossed = "fades over {fade} ms and writes a wheel its fixture does not exclude from the fade (<ExcludeFade>): the mechanical wheel runs through every colour or gobo in between on each step"
wheel_rotation_spinning = "colours the whole rig but leaves these fixtures' colour wheel in a rotation range, which is not a colour: the wheel sits between two positions and the beam comes out split (half moon)"
wheel_white_on_clock = "the step «{step}» puts white light on {count} fixtures on its own, on the wheel's clock: live, that is the room lit up; white belongs to {full_white} and to nothing that turns by itself (button: {button})"
white_emitter_unused = "writes red, green and blue to {count} fixtures with a White emitter and does not write that channel: white comes out mixed from three LEDs and the fourth, the brightest, stays at zero"
white_twice_washed = "drives the White emitter and also leaves the white inside the RGB on {count} fixtures: the achromatic part of the colour comes out of four LEDs instead of one and the tint washes out"
zoom_narrow_unwritten = "lights the head but does not write its zoom: it keeps whatever the last look left, and with nobody writing it that is 0, whichever end that is on this model"
