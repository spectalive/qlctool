desk_burst_speed_modes = "SpeedModes debe fijar Duration=PerStep y fundidos Common"
desk_burst_zero_fades = "los fundidos comunes deben ser cero"
desk_burst_time_clock = "el reloj debe contar milisegundos"
desk_burst_one_step = "requiere exactamente un paso"
desk_burst_step_timing = "el paso debe durar {duration} ms sin fundidos"
desk_burst_step_no_scene = "el paso no referencia una escena"
desk_burst_scenes = "el paso y su origen deben ser escenas"
desk_burst_private_copy = "el paso debe ser una copia privada con los mismos FixtureVal"
desk_burst_shared_scene = "otra funcion referencia la escena privada"
desk_burst_auto_start = "otra funcion puede arrancar la rafaga automaticamente"
desk_burst_widget_scene = "un widget referencia directamente la escena privada"
desk_burst_one_button = "la rafaga debe tener un unico boton y ningun otro control"
empty_frame_nothing_to_press = "este marco no tiene ningun control dentro, solo textos o nada: en la consola no hay nada que pulsar en el"
empty_frame_untitled = "marco {id}"
empty_frame_untitled_solo = "marco solo {id}"
family_owner_no_toggle = "no tiene su Toggle en el marco: un estado de la sala tambien escribe esa familia y al cambiar de estado la eleccion quedaria suelta"
family_owner_state_pick = "es un pick que un estado de la sala tambien arranca: el marco solo lo apagara al arrancar ese estado"
family_owner_starts_hook = "arranca el hook «{hook}» del mismo marco solo: el marco lo apagara nada mas pulsarlo"
flash_scene_not_a_scene = "cuelga en modo Flash del boton «{button}», pero es un {kind}: QLC+ solo sabe flashear escenas (Scene::flash), asi que el boton se queda a medias"
flash_scene_nothing = "nada"
flash_speed_slow = "es el flash mas rapido que reciben {count} canales de estrobo y se queda al {slowest:.0%} de su carrera slow-to-fast - un flash a toda velocidad vive del {fast:.0%} para arriba"
flash_speed_crawl = "escribe {count} canales de estrobo por debajo del {crawl:.0%} de su carrera slow-to-fast (el peor al {slowest:.0%}) - eso ya no es un flash, es un parpadeo a paso de tortuga"
flash_strobe_audio = "estroba y lo pulsa una barra de audio: un estrobo disparado por lo que haga la musica es un estrobo que nadie ha elegido"
flash_lit_smoke_column_dark = "cuelga de un boton Flash, enciende todo el rig y deja {count} maquinas de humo con luz sin encender su LED: mientras se mantiene, las columnas siguen con el color de debajo, sin estrobo, y se ven apagadas al lado del flash"
flash_strobe_not_strobing = "cuelga de un boton Flash y escribe {count} aparatos con canal de estrobo sin estrobarlos - en este show un flash mantenido estroba, y dejar el shutter en «Open»/«No function» es la luz de trabajo, no el golpe"
grid_order_row_jumps = "la fila {row} de la rejilla salta por el escenario {count} veces ({jumps}{more}): un barrido por la rejilla no barre la sala. `qlctool patch --group-sort {group}` la reordena"
grid_order_not_rigged = "sin colgar"
group_grid_heads_outside = "declara {width}x{height} pero tiene {outside} head(s) fuera de esa rejilla: ningun efecto los alcanza"
group_grid_dark_cells = "declara {width}x{height} = {cells} celdas y solo {lit} tienen luz: en cada barrido {empty} celda(s) se quedan a oscuras sin motivo"
held_column_latched_pump = "dispara la bomba de las columnas de humo desde un boton que se queda enganchado: la columna solo debe salir mientras se mantiene pulsada la tecla"
instant_dimmer_dark = "en algun instante suyo pone color a {count} aparatos y ningun miembro escribe su dimmer: el dimmer es Intensity, QLC+ lo pone a cero cada ciclo, y el aparato esta coloreado en los datos y apagado en la sala"
intensity_dark_one = "pone color pero no abre la intensidad, asi que ese fixture se queda a oscuras (boton: {button})"
intensity_dark_many = "pone color pero no abre la intensidad, asi que esos fixtures se quedan a oscuras (boton: {button})"
internal_program_colour = "da color a un fixture sin sacarlo de su programa interno: mientras ese canal siga en automatico el fixture ignora el rojo, verde y azul que le mandas"
latched_strobe_loops = "es un estrobo que hace bucle y cuelga del boton «{caption}»: una pulsacion y el rig parpadea hasta que alguien lo apague; una rafaga es un chaser SingleShot que termina solo"
layer_adds_htp_colour = "es un Toggle («{caption}») que pone color sobre {count} aparatos que el estado ya colorea: RGB mezcla HTP, asi que rojo sobre cyan es blanco, nunca rojo - un color que sustituye es un Flash con ForceLTP"
layer_trace_ltp_left = "es un Toggle («{caption}») que escribe {count} canales LTP que ningun estado de la sala escribe nunca: al apagarlo el valor se queda hasta que alguien lo cambie a mano"
masked_dimmer_efx_hidden = "«{full}» clava un dimmer a {level} mientras «{efx}» lo mueve como efecto a la vez: la intensidad mezcla HTP, nada supera {level} y el efecto no se ve nunca"
mode_owner_unwritten = "el canal con el que el fixture corre sus propios programas no lo escribe ninguna funcion del show: se queda con lo que dejo la noche anterior y mientras este arriba el aparato ignora posicion, color e intensidad"
movement_families_mixed = "mueve {washes} wash(es) y {beams} beam(s) con la misma geometria; un haz de 2 grados y un wash ancho no comparten tamaño ni velocidad - un EFX por familia"
movement_figure_still_heads = "mueve {moved} aparatos del grupo y deja {still} quietos aunque tienen pan y tilt: la figura solo la dibuja una familia de optica"
movement_window_outside = "dibuja {outside}, y el publico esta en pan {pan_min}-{pan_max} tilt {tilt_min}-{tilt_max}: parte de la figura apunta fuera de la sala"
pad_input_unknown_channel = "escucha el canal {channel}, que no esta en el perfil del pad: ningun control del aparato manda ese numero, asi que el widget no se puede pulsar desde el hardware"
pad_input_shared_channel = "comparte el canal {channel} con {others}: un solo control dispara todos a la vez"
pad_input_no_input = "{count} widget(s) tienen binding MIDI y ningun universo declara <Input>: QLC+ abre el show sin nadie escuchando y el pad no hace nada hasta configurarlo a mano"
parked_movers_still = "es un bloque del ciclo automatico que mueve unas cabezas y deja estas quietas durante todo el paso: una lira que no se mueve durante minutos parece averiada, no en reposo"
pick_darkens_dark = "el pick «{pick}» para sus hooks y deja {count} aparatos coloreados sin dimmer o con el obturador cerrado"
pick_overridden_one_step = "es un Toggle («{caption}») sobre una rueda o una posicion que un chaser de {overridden} vuelve a escribir en su siguiente paso: el fader nuevo entra detras y gana - la eleccion dura un paso; un Flash con Override dura lo que dure la mano"
shadowed_intensity_hidden = "«{member}» deja un dimmer a {low} mientras «{top}» tiene el mismo canal a {top_value} a la vez: la intensidad mezcla HTP, gana el alto y la bajada no se ve nunca"
shutter_endpoint_half_open = "abre el obturador a {value} en vez de {endpoint}: dentro del rango 'abierto', pero sin llegar al extremo - la 7R se queda a oscuras en mitad de ese rango"
smoke_in_scene = "enciende la maquina de humo dentro de una escena que toca otros fixtures: el humo se queda abierto mientras esa escena corra"
smoke_light_dark_column = "la maquina de humo con luz dispara la columna pero ninguna funcion enciende su LED (dimmer + color a la vez): con DMX conectado su programa interno queda anulado y la columna sale a oscuras"
smoke_restore_pump_left = "el boton «{caption}» abre la bomba de humo en un canal que QLC+ no reinicia solo - no esta en el grupo Intensity - y la funcion no lo cierra: al soltar, la maquina sigue tirando hasta vaciar el deposito"
solo_handoff_excludes_monitored = "ignora a los botones que solo vigilan: otro estado o boton arranca {names} y una eleccion del marco no lo apagara (ExcludeMonitored debe ser False)"
split_complementary_one_wash = "alterna dos colores opuestos ({degrees:.0f} grados) dentro de un mismo grupo: donde se solapan se desaturan hacia blanco. Los complementarios van entre roles (cabezas contra resto); en un mismo lavado, colores vecinos (boton: {button})"
state_handover_inherits = "enciende {count} aparatos sin escribir {roles}: esos canales son LTP y se quedan como los dejo el estado anterior - la luz de trabajo sale con el gobo y el prisma del ultimo nivel"
state_palette_too_many = "el paso «{step}» pone {count} colores a la vez en la sala y el estado la deja rotar sola: como mucho dos (un fondo y las cabezas); lo multicolor es un boton aparte (boton: {button})"
state_proxy_starts_state = "arranca «{state}», que es un boton del marco de estados de la sala: el boton se entera aunque lo arranque un chaser (qmlui VCButton::slotFunctionRunning) y el solo frame para el estado que estuviera sonando - el show se muere a mitad de rafaga"
stepped_dimmer_half = "escribe un valor intermedio en un dimmer que no es un fader sino una pala mecanica: a medio recorrido tapa media lente y el haz sale como una media luna - o abierto del todo o cerrado"
strobe_black_intensity_only = "cuelga de «{caption}» y su paso negro ({step}) solo escribe canales Intensity, que mezclan HTP: con un estado encendido debajo el 0 pierde y el estrobo nunca llega a negro - un estrobo sobre la sala es una escena mantenida en los shutters"
strobe_coverage_left_out = "es una escena de estrobo que deja fuera {count} aparatos con canal de estrobo: media sala parpadea y la otra media se queda mirando"
strobe_in_cycle_steps = "lleva {count} efecto(s) de estrobo entre sus pasos, asi que el rig parpadea sin que nadie lo haya pedido; un estrobo va en su propio boton"
strobe_rate_too_fast = "parpadea a {rate:.1f} Hz; por encima de {limit:.0f} Hz entra en la banda de riesgo de epilepsia fotosensible - la guia britanica de espectaculos corta en 4 por segundo"
strobe_restore_left_strobing = "el flash «{caption}» estroba un canal que {states} no escribe: al soltar, el canal LTP se queda estrobando hasta que alguien lo apague a mano"
tap_dial_no_functions = "tiene tecla de tap y no lista ninguna funcion: en QLC+ 5.2.2 el tap solo escribe en las funciones del dial («Unknown speed dial tag: ControlBPM» al cargar), asi que asi no re-tempa nada"
tap_dial_same_multiplier = "re-tempa {count} funciones con el mismo multiplicador: un tap las deja a todas de la misma duracion (VCSpeedDial::applyFunctionsTime escribe tiempo x multiplicador) - cada capa tiene que decir cuantos taps dura"
tempo_units_collection_tempo = "es una coleccion y lleva <Tempo>: una coleccion no tiene tempo propio, arranca a sus miembros y ya - QLC+ lo dice al cargar («Unknown collection tag: Tempo») y lo ignora, asi que esa capa se queda en el reloj sin avisar"
tempo_units_beats_fade = "va en Beats con un fundido de {fade} y arranca {count} funciones que se cronometran en milisegundos: el chaser les pasa ese numero tal cual y un EFX se lo resta a su duracion (EFX::loopDuration), asi que dibujan su figura mucho mas rapido y no la cierran"
unaimed_movement_mid_tilt = "dibuja la figura centrada en el tilt {tilt}, que es el centro del recorrido y no un sitio: es donde queda una figura que nadie ha apuntado - el suelo en las 7R, la pared del fondo en los washes"
undeclared_heads_one_head = "la definicion le da {sets} juegos de RGB y solo {declared} <Head> con rojo, verde y azul dentro: QLC+ fabrica una sola cabeza y se queda con el ultimo rojo, verde y azul, asi que una matriz sobre «{group}» solo pinta uno de los juegos y los demas se quedan con lo ultimo que alguien escribio"
unfinished_effect_cut = "corta {count} de sus efectos antes de que terminen: «{effect}» necesita {needed} ms para una pasada completa y solo tiene {given} ms"
untempoed_rhythm_no_dial = "«{member}» mueve la intensidad de {count} aparatos y no esta bajo ningun dial de tempo: su paso no cambia cuando cambia el de la sala"
wheel_colour_missed = "da color a un grupo pero no escribe nada en los fixtures de ese grupo cuyo color es una rueda: se quedan con el color anterior (boton: {button})"
wheel_fade_crossed = "se funde en {fade} ms y escribe una rueda que su fixture no excluye del fundido (<ExcludeFade>): la rueda mecanica recorre todos los colores o gobos intermedios en cada paso"
wheel_rotation_spinning = "da color a todo el rig pero deja la rueda de color de estos fixtures en un rango de giro, que no es un color: la rueda queda entre dos posiciones y el haz sale a medias (media luna)"
wheel_white_on_clock = "el paso «{step}» pone luz blanca en {count} aparatos por su cuenta, en el reloj de la rueda: en directo es la sala encendida; el blanco es de {full_white} y de nada que gire solo (boton: {button})"
white_emitter_unused = "escribe rojo, verde y azul en {count} aparatos con emisor White y no escribe ese canal: el blanco sale mezclado de tres LED y el cuarto, el mas brillante, se queda a cero"
white_twice_washed = "manda el emisor White y deja el blanco tambien dentro del RGB en {count} aparatos: la parte acromatica del color sale por cuatro LED en vez de uno y el tinte se lava"
zoom_narrow_unwritten = "enciende la cabeza pero no escribe su zoom: se queda con el que dejo el ultimo look, y sin nadie que lo escriba eso es 0, sea el extremo que sea en ese modelo"
