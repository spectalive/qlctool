# Lo que dice cada hallazgo de `qlctool check` (ruling B10, round 2): el
# `message_id` de un Finding y las palabras que sus campos toman del catalogo.
[findings]
missing_definition = "no hay definicion de fixture para este modelo (buscado en {searched}): ninguna regla ve sus canales, asi que este check no dice nada de el; usa --fixtures, QLCTOOL_FIXTURES o un qlctool.toml"
missing_mode = "la definicion no tiene el modo {mode}: ninguna regla ve los canales de este fixture, asi que este check no dice nada de el; repatchealo en un modo de la definicion o corrige la definicion"
accent_restore_wheel_left = "el flash «{caption}» mueve una rueda (gobo, prisma o color) que {states} no escribe: al soltar, la rueda se queda donde el flash la dejo y nadie la devuelve"
audio_trigger_unbound = "no tiene ninguna banda enlazada a canal, funcion o widget: no hace nada"
audio_trigger_presses_solo = "la banda «{band}» de «{caption}» presiona «{target}», que comparte un marco solo con otras funciones: la musica para lo que estuviera sonando y nada lo recupera"
audio_trigger_starts_function = "la banda «{band}» de «{caption}» lo arranca: la musica lo dispara sola, sin que nadie decida cuando"
caption_promise_missing = "el rotulo ({identifier}) promete {promises} y el rig no lo tiene: la consola habla de algo que no hay"
promise_gobo = "rueda de gobos"
promise_prism = "prisma"
promise_haze = "maquina de humo"
promise_beam_wheel = "beam con rueda de color"
promise_bar = "barra de pixeles"
promise_panel = "panel con efectos propios"
promise_builtin_effects = "aparato con efectos propios"
promise_heads = "aparato con pan y tilt"
promise_dimmer = "aparato con dimmer de fader"
collision_same_channels = "arranca a la vez «{first}» y «{second}», y los dos escriben los mismos canales de color, rueda o posicion: se suman en vez de elegir"
colour_animation_wheel_stuck = "anima el color de {animated} aparatos RGB y deja {stuck} con rueda de color en una sola posicion: el efecto recorre la sala y esos se quedan en un color fijo"
colour_clocks_together = "arranca a la vez {clocks}, dos ciclos que rotan color cada uno a su ritmo: los fixtures de uno van a su bola respecto al resto (boton: {button})"
list_and = " y "
console_solo_clash = "comparte el marco solo «{frame}» con {clash}, que es lo que arranca: el marco lo apagara nada mas pulsarlo"
console_same_key = "comparten la tecla «{key}»: pulsarla dispara todos"
console_off_screen = "se sale de la pantalla ({right}x{bottom} sobre {width}x{height}): nadie puede pulsarlo"
console_out_of_frame = "se sale de su propio marco «{frame}» ({right}x{bottom} sobre {width}x{height} del marco): queda cortado o invade lo que hay al lado"
console_two_blackouts = "tiene dos botones Blackout («{seen}» y «{caption}»): uno de los dos siempre parecera apagado"
dangling_reference_missing = "nombra la funcion {function}, que no existe en este workspace: ese paso o ese boton no arranca nada"
dangling_reference_empty = "(vacio)"
desk_burst_incomplete = "requiere un origen, una duracion y un unico Toggle de rafaga"
desk_burst_needs_toggle = "requiere un Toggle independiente en CONTROL"
desk_burst_not_a_chaser = "el boton no apunta a un Chaser"
