[help]
help_show_1 = "Arriba: en qué estado está la sala. Solo puede haber UNO — pulsar otro cambia el estado, no se suman. AUTO es el normal: colores, humo y la noche subiendo y bajando sola."
help_show_2 = "Los MOMENTOS son para cuando pasa algo: alguien sube a hablar (CHARLA), la sala baja (TRANQUILO), va bien (FIESTA), el último tema (LOCURA). Cuando pase el momento, vuelve a pulsar AUTO."
help_show_3 = "Abajo: los GOLPES. Esos SÍ se suman a lo que esté sonando. FLASH, STROBO y HUMO YA funcionan mientras los mantienes pulsados y se apagan al soltar."
help_show_4 = "PARAR TODO apaga todas las funciones a la vez: es el botón de cuando algo se ha quedado encendido y no sabes cuál."
help_show_5 = "PgDn / PgUp cambian de página: 2 = JUGAR, 3 = CONTROL, 4 = LIBRERÍA. Las teclas funcionan desde cualquier página."
tempo_1 = "TEMPO — pulsa M al ritmo: colores,"
tempo_2 = "gobos, prisma y dimmer siguen tu"
tempo_3 = "compás. Las cabezas también (pág. 3)."
movement_dial_1 = "Velocidad de las cabezas. La misma"
movement_dial_2 = "tecla M que el tempo de la página 1:"
movement_dial_3 = "una figura son 16 taps."
grand_master_1 = "MASTER GENERAL — corta la"
grand_master_2 = "intensidad de toda la sala"
grand_master_3 = "sobre lo que ya esté"
grand_master_4 = "encendido. Arriba = normal"
grand_master_5 = "(255), abajo = todo apagado."
library_1 = "Esta página es el almacén: las mezclas de dos colores, las matrices y"
library_2 = "los 42 efectos propios de los paneles. Están aquí para mirarlos y para"
library_3 = "construir AUTO con ellos, no para pulsarlos con la sala llena."
library_4 = "Las flechas de la cabecera de cada marco cambian de grupo: cada grupo"
library_5 = "de luces tiene sus propias mezclas y sus propias matrices."
library_6 = "Los 42 efectos de los paneles no los ha visto nadie todavía: el aparato"
library_7 = "solo los llama «Effect N». Pulsa, mira, y apunta cuáles valen la pena."
library_8 = "Las ruedas por grupo pintan los mismos fixtures que la rueda general."
library_9 = "Encender las dos a la vez suma los dos colores: sale blanco."
panic_help = "PARAR TODO para las funciones con un fundido de 1 segundo — pulsa AUTO para retomar. APAGON deja la sala a oscuras — vuelve a pulsar APAGON para devolverla, y luego AUTO."
vertical_smoke_help = "Los paneles a sus ciclos de color mientras dispara el humo vertical. Se queda puesto: apágalo al terminar."
panel_speed_help = "Velocidad de los efectos de los paneles. Sigue la del ciclo (200) hasta que lo muevas; desde entonces manda el fader, también a cero. La X roja lo suelta."
colour_guidance = "Pick fijo; repetirlo lo para y deja la familia quieta. AUTO colores o Q/F1-F4 devuelve la rueda; pararla corta su fundido de 800 ms."
cycle_guidance = "Bajo AUTO, el ciclo de energia lo recupera en su siguiente paso (8 min como mucho); para jugar largo pon antes un Momento."
reset_guidance = "Volver del todo: AUTO dos veces si ya esta verde, o Backspace y Q."
pixels_guidance = "Pulsa un efecto y se queda. AUTO paneles devuelve su ciclo."

