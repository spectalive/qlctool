; Managed by codeality-py.
[mypy]
strict = True
warn_unreachable = True
show_error_codes = True
pretty = True
exclude = (?x)(^build/|^dist/|/migrations/)
; The tool runs on the venue Mac and qlc_user_dir branches on sys.platform.
; Without this, mypy on a Linux runner takes the other branch and reports
; the macOS path as unreachable.
platform = darwin

[mypy-tests.*]
disallow_untyped_defs = False

; Adoption ratchet, 2026-09-01: these modules carried 266 errors in strict
; mode when the baseline arrived, nearly all of them missing annotations.
; Fix a module, delete its section. Never add one.
[mypy-qlctool.set_beat_generator]
ignore_errors = True
[mypy-qlctool.checks.rule_held_column]
ignore_errors = True
[mypy-qlctool.checks.rule_latched_strobe]
ignore_errors = True
[mypy-qlctool.checks.rule_mode_owner]
ignore_errors = True
[mypy-qlctool.checks.rule_movement_families]
ignore_errors = True
[mypy-qlctool.checks.rule_smoke_light]
ignore_errors = True
[mypy-qlctool.checks.rule_strobe_rate]
ignore_errors = True
[mypy-qlctool.cli]
ignore_errors = True
[mypy-qlctool.decompose]
ignore_errors = True
[mypy-qlctool.load_definition]
ignore_errors = True
[mypy-qlctool.definition_errors]
ignore_errors = True
[mypy-qlctool.generate.generate_dealt_gobo_scenes]
ignore_errors = True
[mypy-qlctool.generate.generate_dimmer_chases]
ignore_errors = True
[mypy-qlctool.generate.generate_gobo_shake]
ignore_errors = True
[mypy-qlctool.generate.input_profile]
ignore_errors = True
[mypy-qlctool.generate.generate_movement_families]
ignore_errors = True
[mypy-qlctool.generate.generate_prism_spins]
ignore_errors = True
[mypy-qlctool.generate.generate_rainbow_efx]
