; Managed by baseline-py.
[mypy]
strict = True
warn_unreachable = True
show_error_codes = True
pretty = True
exclude = (?x)(^build/|^dist/|/migrations/)
; The tool runs on the venue Mac and qlc_user_dir branches on sys.platform.
; Without this, mypy on a Linux runner takes the other branch and reports
; the macOS path as unreachable.
platform = darwin

[mypy-tests.*]
disallow_untyped_defs = False

; Adoption ratchet, 2026-09-01: these modules carried 266 errors in strict
; mode when the baseline arrived, nearly all of them missing annotations.
; Fix a module, delete its section. Never add one.
[mypy-qlctool.beat_generator]
ignore_errors = True
