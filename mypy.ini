; Managed by codeality-py.
[mypy]
strict = True
warn_unreachable = True
show_error_codes = True
pretty = True
exclude = (?x)(^build/|^dist/|/migrations/)
; The tool runs on the venue Mac and qlc_user_dir branches on sys.platform.
; Without this, mypy on a Linux runner takes the other branch and reports
; the macOS path as unreachable.
platform = darwin

[mypy-tests.*]
disallow_untyped_defs = False

; The adoption ratchet of 2026-09-01 (266 errors in strict mode) is closed:
; its last section went on 2026-10-07. Never add an ignore_errors section.

; pygdtf and pymvr (the GDTF/MVR writers behind `qlctool mvr`) ship no
; stubs and no py.typed marker. Their API is used through a thin layer in
; qlctool/mvr; drop these when upstream publishes types.
[mypy-pygdtf.*]
ignore_missing_imports = True

[mypy-pymvr.*]
ignore_missing_imports = True
