; pygdtf and pymvr (the GDTF/MVR writers behind `qlctool mvr`) ship no
; stubs and no py.typed marker. Their API is used through a thin layer in
; qlctool/mvr; drop these when upstream publishes types.
[mypy-pygdtf.*]
ignore_missing_imports = True

[mypy-pymvr.*]
ignore_missing_imports = True
