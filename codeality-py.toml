# codeality-py configuration - https://github.com/syntopica/codeality
schema-version = 1
source-roots = ["qlctool"]
test-roots = ["tests"]
import-package = "qlctool"
respect-gitignore = true
# Measured 86.51% at adoption (2026-09-01). The floor sits above the shared 80
# so the gain cannot drain away unnoticed. Raise it, never lower it.
coverage-threshold = 85
# 32 s on -n auto since 2026-09-22, 19 minutes the night before: the gate says
# so if it ever creeps back. Lower this as the suite gets faster, never raise it.
test-budget-seconds = 120

[limits]
max-file-lines = 150
test-max-file-lines = 300

# A role states what a file is. Prefer a role over a suppression: it explains
# the file instead of silencing an alarm.
[roles]
# Constant tables the show reads: a palette, a mode's colour list, the glyphs a
# pick family marks its tiles with. They carry no unit by design.
data = [
  "qlctool/analogous_pairs.py",
  "qlctool/complementary_pairs.py",
  "qlctool/key_split_pairs.py",
  "qlctool/pastel_palette.py",
  "qlctool/pick_marks.py",
  "qlctool/simple_colors.py",
  "qlctool/split_pairs.py",
  "qlctool/wheel_palette.py",
  "qlctool/vibra/timing.py",
  "qlctool/vibra/tuning.py",
  "qlctool/vibra/keys.py",
  "qlctool/vibra/flash_functions.py",
  "qlctool/vibra/console.py",
  "qlctool/vibra/matrix_colors.py",
  "qlctool/vibra/colours.py",
]
registry = []
entrypoint = []
generated = []
namespace-init = []

[[overrides]]
paths = ["qlctool/checks/rule_*.py"]
disable = ["BPY002"]
reason = "CLAUDE.md defines the check-rule convention: a rule lives in checks/rule_<name>.py and exposes check_<name>. The pairing is the repository's own naming rule, not a mismatch"
