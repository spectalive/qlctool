# codeality-py configuration - https://github.com/syntopica/codeality
schema-version = 1
source-roots = ["qlctool"]
test-roots = ["tests"]
import-package = "qlctool"
respect-gitignore = true
# Measured 86.51% at adoption (2026-09-01). The floor sits above the shared 80
# so the gain cannot drain away unnoticed. Raise it, never lower it.
coverage-threshold = 95
# 32 s on -n auto since 2026-09-22, 19 minutes the night before: the gate says
# so if it ever creeps back. Lower this as the suite gets faster, never raise it.
test-budget-seconds = 120

[limits]
max-file-lines = 150
test-max-file-lines = 300

# A role states what a file is. Prefer a role over a suppression: it explains
# the file instead of silencing an alarm.
[roles]
# Constant tables the show reads: a palette, a mode's colour list, the glyphs a
# pick family marks its tiles with. They carry no unit by design.
data = [
  # The measured audience windows for beams and washes, split from AudienceWindow.
  "qlctool/audience_windows.py",
  # The SMC-PAD input profile's labels, control numbers and header text.
  "qlctool/generate/input_profile_constants.py",
  # The SMC-PAD measured numbers, re-exported by smc_pad_device.py.
  "qlctool/generate/smc_pad_constants.py",
  "qlctool/analogous_pairs.py",
  "qlctool/complementary_pairs.py",
  "qlctool/efx_shape_identifiers.py",
  "qlctool/key_split_pairs.py",
  "qlctool/pastel_palette.py",
  "qlctool/pick_marks.py",
  "qlctool/simple_colors.py",
  "qlctool/smoke_types.py",
  "qlctool/split_pairs.py",
  "qlctool/wheel_palette.py",
  # Every channel role's string value; role_of.py (split out 2026-09-27) is
  # the only unit that derives one.
  "qlctool/roles.py",
  # The RGB script names QLC+ ships and the curated per-group script recipes;
  # curated_script.py (split out 2026-09-27) carries the one dataclass.
  "qlctool/matrix_algorithms.py",
  "qlctool/vibra/timing.py",
  "qlctool/vibra/tuning.py",
  "qlctool/vibra/keys.py",
  "qlctool/vibra/flash_functions.py",
  "qlctool/vibra/console.py",
  "qlctool/vibra/matrix_colors.py",
  "qlctool/vibra/colours.py",
  "qlctool/vibra/controllers.py",
  "qlctool/description/reading/description_sections.py",
  "qlctool/description/reading/duration_tables.py",
  "tests/literal_strip.py",
  # What each generator-chosen console caption promises, and the words a
  # finding names those promises with.
  "qlctool/checks/caption_promises.py",
  # The channel families the console's family frames hand between hooks and picks.
  "qlctool/checks/families.py",
  "qlctool/checks/promise_words.py",
  # The complementary threshold, shared by a check and a generator.
  "qlctool/complementary_from.py",
  # The show generator's fixed tables: where a new show is saved, and the
  # matrix algorithms it offers and cycles.
  "qlctool/generate/show_path.py",
  "qlctool/generate/default_matrix_algorithms.py",
  "qlctool/generate/cycle_algorithms.py",
  # The live console's layout numbers and identifier tables (2026-09-27 split).
  "qlctool/generate/console_layout.py",
  # The measured audience window's aim and half-span for beams and washes, so
  # a generated figure's window matches what the movement-window rule checks.
  "qlctool/generate/movement_aim.py",
  # Per-family movement envelopes (sizes, durations, offsets) generate_movement_families reads.
  "qlctool/generate/wash_envelopes.py",
  "qlctool/generate/beam_envelopes.py",
  "qlctool/generate/movement_crossfade_ms.py",
  # The XML namespace every QLC+ input profile element lives in.
  "qlctool/generate/profile_ns.py",
  # Shared placement numbers for the JUGAR page's frames and button grid.
  "qlctool/generate/play_page_layout.py",
  # Which physical SMC-PAD control fires each console widget; the numbers
  # come from smc_pad_device.py.
  "qlctool/generate/smc_pad_bindings.py",
  # Each SMC-PAD master function's console/LED colour, split out of
  # smc_pad_colors.py alongside its unrelated readable_foreground helper.
  "qlctool/generate/function_colors.py",
  # One constant each, imported where it is needed: a tag list, the console
  # canvas of a workspace that states none, an invalid function id sentinel, a
  # folder name, a language, a pattern, the catalogue's sections and where the
  # catalogues live.
  "qlctool/checks/bound_widgets.py",
  "qlctool/checks/default_canvas.py",
  "qlctool/checks/invalid_function_id.py",
  "qlctool/checks/rule_group.py",
  "qlctool/desk_function_path.py",
  "qlctool/names/catalogue_dir.py",
  "qlctool/names/default_language.py",
  "qlctool/names/identifier_pattern.py",
  "qlctool/names/sections.py",
  # How long a live MCP write waits before reading back what it changed.
  "qlctool/mcpserver/settle_seconds.py",
  # The lines QLC+ 5 logs once a workspace is loaded, which validation waits for.
  "qlctool/qml_loaded_markers.py",
  # The widget type names QLC+ 5 answers in each language it ships.
  "qlctool/mcpserver/pressable_widget_types.py",
  "qlctool/mcpserver/unknown_widget_types.py",
  # The shapes two movement checks compare: one rigged head of an EFX, and one
  # EFX as the room sees it.
  "qlctool/checks/efx_head.py",
  "qlctool/checks/movement_figure.py",
  # The channel roles two functions must never drive at once, and the ones they may.
  "qlctool/checks/color_roles.py",
  # The console widget tags a canvas or a solo-frame walk counts as a widget.
  "qlctool/checks/console_widget_tags.py",
  # The three SpectrumBar Type codes: DMX channel, function, or another widget.
  "qlctool/checks/spectrum_bar_types.py",
  # The workspace XML namespace, doctype and function-type strings QLC+ 4.13.1
  # emits, reverse-engineered from its own source.
  "qlctool/constants.py",
  # The EFX movement algorithm strings QLC+ matches against verbatim.
  "qlctool/efx_algorithms.py",
  # The show's colour palette and its screen-wide primary bank, mined from
  # DeluxeEventos2's real scenes and matrices.
  "qlctool/palette.py",
]
# Instances other code finds by name: the MIDI pads a description can ask for,
# the SMC-PAD's profile, and the two rule providers the `qlctool.rules` entry
# points in pyproject.toml load.
registry = [
  "qlctool/controllers/midi_pads.py",
  "qlctool/controllers/smc_pad_profile.py",
  "qlctool/controllers/smc_pad_rules.py",
  "qlctool/controllers/tablet_desk_rules.py",
]
# The published `qlctool.cli:main` import path (pyproject script, vibra-lighting),
# re-exporting main from main.py, and the SMC-PAD writer and map published paths.
entrypoint = ["qlctool/cli.py", "qlctool/generate/input_profile.py", "qlctool/generate/smc_pad_device.py"]
generated = []
namespace-init = []

[[overrides]]
paths = ["qlctool/checks/rule_*.py"]
disable = ["BPY002"]
reason = "CLAUDE.md defines the check-rule convention: a rule lives in checks/rule_<name>.py and exposes check_<name>. The pairing is the repository's own naming rule, not a mismatch"

[[overrides]]
paths = ["qlctool/checks/frame_holds_a_control.py", "qlctool/mach_o_architectures.py"]
disable = ["BPY002"]
reason = "The file names the function word for word. BPY002 merges a one-letter word into the next (frame_holds_acontrol, mach_oarchitectures), which is its rule for acronyms such as IPv6, not for the English article or the o of Mach-O"
