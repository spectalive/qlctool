[project]
name = "qlctool"
version = "0.1.0"
description = "Programmatic editing of QLC+ workspaces (.qxw) for the Vibra lighting show"
requires-python = ">=3.11"
dependencies = ["lxml>=5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qlctool = "qlctool.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qlctool*"]

[tool.setuptools.package-data]
# The vendored QLC+ system definitions and QLC+'s own fixture schema are
# data the library reads at runtime, not just test material.
qlctool = ["library/*.xsd", "library/system/*.qxf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
