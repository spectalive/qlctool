[project]
name = "qlctool"
version = "0.1.0"
description = "Programmatic editing of QLC+ workspaces (.qxw) for the Vibra lighting show"
requires-python = ">=3.11"
dependencies = ["lxml>=5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qlctool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
