[project]
name = "qlctool"
version = "0.1.0"
description = "Programmatic editing of QLC+ workspaces (.qxw) for the Vibra lighting show"
requires-python = ">=3.11"
dependencies = ["lxml>=5", "pygdtf>=1.4.5", "pymvr>=1.0.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3"]

[project.scripts]
qlctool = "qlctool.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qlctool*"]

[tool.setuptools.package-data]
# The vendored QLC+ system definitions and QLC+'s own fixture schema are
# data the library reads at runtime, not just test material. The locale
# catalogues are read the same way.
qlctool = ["library/*.xsd", "library/system/*.qxf", "locales/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# One worker per core. The QLC+ launches serialise on validate.LAUNCH_LOCK
# whatever the worker count (2026-09-22: 138 s serial, 47 s on four workers,
# 32 s on twelve). `-n 0` runs the suite in-process, for a debugger.
addopts = "-n auto"

[tool.deptry]
known_first_party = ["qlctool"]

[tool.deptry.per_rule_ignores]
DEP002 = [
  "pytest",  # invoked as a command; the tests import it, deptry scans sources
  "pytest-xdist",  # a pytest plugin, loaded by the `-n` in addopts
]
# Test tooling legitimately lives in a dev group and is imported only by tests.
DEP004 = ["pytest", "pytest_asyncio", "pytest_cov"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[dependency-groups]
quality = [
  "syntopica-codeality-py>=0.2.3,<1",
  "deptry>=0.20,<1",
  "lxml-stubs>=0.5,<1",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "pytest-xdist>=3,<4",
  "ruff>=0.15,<1",
]
