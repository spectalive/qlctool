name: Quality

# Minutes are free on a public repository, but every run still ties up
# runners for twenty minutes, so a push to main gets one leg, a docs-only
# push none, and the full matrix runs on a tag, a pull request or by hand.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'TODO.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One leg on an ordinary push; both on a tag, a pull request or a
        # manual run.
        python-version: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name != 'push') && fromJSON('["3.11", "3.13"]') || fromJSON('["3.13"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Check the lockfile is current
        run: uv lock --check

      # Every extra and every group: the gate audits and tests the environment
      # it runs in, and a group-only install leaves out the extras the tests
      # import.
      - name: Install from the lockfile
        run: uv sync --locked --all-extras --all-groups
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Run the quality gate
        run: uv run codeality-py gate --json
        # The runner has four cores and coverage uses the C tracer below 3.14:
        # measured up to 477 s on 3.11. The local 120 s in codeality-py.toml stays the rule.
        env:
          CODEALITY_PY_TEST_BUDGET_SECONDS: '600'

      - name: Type-check with pyrefly, without blocking
        continue-on-error: true
        run: |
          uv run --with pyrefly pyrefly check --output-format json > pyrefly.json || true

      - name: Upload the pyrefly shadow report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pyrefly-shadow-${{ matrix.python-version }}
          path: pyrefly.json
          retention-days: 90
